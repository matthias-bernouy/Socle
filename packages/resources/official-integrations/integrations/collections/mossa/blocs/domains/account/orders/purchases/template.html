<mossa-purchases-controller data-p9r-composition-controller>
    <input data-pagination-page cms-param-sync="page" type="hidden">
    <section data-purchases-source cms-source="/.cms/sources/commerce/myOrders?limit=8&amp;offset=0">
        <mossa-stack gap="sm" cms-condition="$source.loading">
            <mossa-skeleton height="6.5rem" animation="wave" data-loading label="Loading purchases"></mossa-skeleton>
            <mossa-skeleton height="6.5rem" animation="wave" aria-hidden="true"></mossa-skeleton>
            <mossa-skeleton height="6.5rem" animation="wave" aria-hidden="true"></mossa-skeleton>
        </mossa-stack>

        <mossa-surface-card data-login appearance="outlined" density="spacious" cms-condition="$source.error &amp;&amp; $source.status == 401">
            <strong slot="title">Sign in to view your purchases</strong>
            <span slot="description">Order history is available only from your account.</span>
            <slot name="login-action" slot="actions"></slot>
        </mossa-surface-card>

        <mossa-surface-card data-error appearance="outlined" density="spacious" cms-condition="$source.error &amp;&amp; $source.status != 401">
            <strong slot="title">Your purchases could not be loaded</strong>
            <span slot="description" data-error-message>Your purchases could not be loaded. Try again shortly.</span>
        </mossa-surface-card>

        <mossa-surface-card data-empty appearance="outlined" density="spacious" cms-condition="$source.loaded &amp;&amp; total == 0">
            <strong slot="title">No purchases yet</strong>
            <span slot="description">Your orders will appear here after your first purchase.</span>
            <slot name="empty-action" slot="actions"></slot>
        </mossa-surface-card>

        <mossa-stack gap="lg" cms-condition="$source.loaded &amp;&amp; total &gt; 0">
            <mossa-stack gap="sm">
                <mossa-surface-card
                    appearance="outlined"
                    density="compact"
                    data-purchase-item
                    data-order-id="{{ order.id }}"
                    data-order-number="{{ order.orderNumber }}"
                    data-first-title="{{ order.lineSummary.firstTitle }}"
                    data-line-count="{{ order.lineSummary.lineCount }}"
                    data-created-at="{{ order.createdAt }}"
                    data-order-status="{{ order.status }}"
                    data-settlement-status="{{ order.operation.settlementStatus }}"
                    data-payment-status="{{ order.operation.paymentStatus }}"
                    data-claim-status="{{ order.operation.claimStatus }}"
                    data-total-amount="{{ order.totalAmount }}"
                    data-currency="{{ order.currency }}"
                    cms-repeat="items as order"
                >
                    <mossa-responsive-grid min="sm" max="none" gap="md" style="align-items: center">
                        <mossa-stack gap="xs">
                            <strong data-purchase-title></strong>
                            <small data-purchase-meta></small>
                        </mossa-stack>
                        <mossa-badge data-purchase-status variant="filled"></mossa-badge>
                        <mossa-stack gap="xs">
                            <small data-total-label>Total</small>
                            <strong data-total-value></strong>
                        </mossa-stack>
                        <mossa-button data-order-action appearance="outlined" tone="neutral" size="sm">
                            <a>View order</a>
                        </mossa-button>
                    </mossa-responsive-grid>
                </mossa-surface-card>
            </mossa-stack>
            <mossa-pagination
                data-pagination
                page="1"
                page-size="8"
                total="{{ total }}"
                aria-label="Purchase pagination"
                cms-condition="total &gt; limit"
            ></mossa-pagination>
        </mossa-stack>
    </section>
</mossa-purchases-controller>
