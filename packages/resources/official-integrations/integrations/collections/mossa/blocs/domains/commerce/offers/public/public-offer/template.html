<mossa-public-offer-controller data-p9r-composition-controller>
    <form data-offer-source cms-source="/.cms/sources/commerce/offer" cms-source-trigger="submit" cms-source-method="GET">
        <input data-offer-slug name="slug" type="hidden">

        <div data-loading>
            <mossa-responsive-grid min="md" packing="fit" gap="lg">
                <mossa-skeleton height="34rem" animation="wave" label="Loading offer"></mossa-skeleton>
                <mossa-skeleton height="34rem" animation="wave" aria-hidden="true"></mossa-skeleton>
            </mossa-responsive-grid>
        </div>

        <mossa-surface-card data-error hidden appearance="outlined" density="spacious">
            <strong slot="title" data-error-title>Offer not found</strong>
            <span slot="description" data-error-message>This offer is no longer available or does not exist.</span>
            <mossa-button slot="actions" appearance="outlined" tone="neutral">
                <a data-back href="#">Back to offers</a>
            </mossa-button>
        </mossa-surface-card>

        <mossa-stack data-content hidden gap="xl">
            <mossa-offer-details balance="even" ratio="landscape" data-detail>
                <img
                    slot="main-media"
                    data-main-image
                    data-source-image-access="public"
                    alt=""
                    loading="eager"
                    decoding="async"
                >
                <img
                    slot="thumbnails"
                    cms-repeat="media as item"
                    data-media-id="{{ item.media.id }}"
                    data-media-main="{{ item.isMain }}"
                    data-source-width="{{ item.media.width }}"
                    data-source-height="{{ item.media.height }}"
                    alt="{{ item.media.alt }}"
                    loading="lazy"
                    decoding="async"
                >

                <h1 slot="title" data-title></h1>
                <p slot="meta" data-meta></p>
                <mossa-condition slot="badge" data-condition></mossa-condition>
                <p slot="description" data-description></p>

                <mossa-specifications slot="valuation" data-valuation>
                    <mossa-specification emphasis="price">
                        <span slot="label" data-valuation-label>Reference value</span>
                        <span slot="value" data-valuation-value></span>
                    </mossa-specification>
                </mossa-specifications>

                <mossa-specifications slot="price">
                    <mossa-specification emphasis="price">
                        <span slot="label" data-price-label>Seller price</span>
                        <span slot="value" data-price></span>
                    </mossa-specification>
                </mossa-specifications>

                <mossa-stack slot="specifications" gap="md">
                    <mossa-specifications data-specifications></mossa-specifications>
                </mossa-stack>

                <mossa-meta slot="shipping" data-shipping>
                    <span slot="icon" aria-hidden="true">⌂</span>
                    <span data-shipping-message>Pickup-point delivery available</span>
                </mossa-meta>

                <mossa-button slot="actions" appearance="filled" size="lg" width="full">
                    <a data-buy>Buy</a>
                </mossa-button>
                <mossa-button slot="actions" appearance="outlined" tone="neutral" size="lg" width="full">
                    <a data-negotiate>Make an offer</a>
                </mossa-button>
            </mossa-offer-details>

            <mossa-responsive-grid min="sm" packing="fit" gap="sm">
                <mossa-trust-item>
                    <span slot="icon" aria-hidden="true">✓</span>
                    <span data-secure-payment-label>Secure payment</span>
                </mossa-trust-item>
                <mossa-trust-item>
                    <span slot="icon" aria-hidden="true">✓</span>
                    <span data-buyer-protection-label>Buyer protection</span>
                </mossa-trust-item>
                <mossa-trust-item>
                    <span slot="icon" aria-hidden="true">✓</span>
                    <span data-tracked-delivery-label>Tracked delivery</span>
                </mossa-trust-item>
            </mossa-responsive-grid>
        </mossa-stack>
    </form>

    <form data-product-source cms-source="/.cms/sources/commerce/product" cms-source-trigger="submit" cms-source-method="GET" hidden>
        <input data-product-id name="id" type="hidden">
    </form>
    <form
        data-schema-source
        cms-source="/.cms/sources/commerce/offerFilterSchema"
        cms-source-trigger="submit"
        cms-source-method="GET"
        hidden
    >
        <input data-schema-category name="category" type="hidden">
    </form>

    <mossa-toast data-toast role="status" aria-live="polite" position="top-right" duration="5000" hidden></mossa-toast>
</mossa-public-offer-controller>
