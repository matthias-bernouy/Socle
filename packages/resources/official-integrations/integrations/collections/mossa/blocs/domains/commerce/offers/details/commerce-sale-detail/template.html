<mossa-commerce-sale-detail-controller data-p9r-composition-controller>
    <section data-sale-source cms-source="/.cms/sources/commerce/mySale?id=#{orderId}" cms-reload-on="commerce-fulfillment:updated">
        <mossa-responsive-grid min="md" gap="md" cms-condition="$source.loading">
            <mossa-skeleton height="20rem" animation="wave" label="Loading sale"></mossa-skeleton>
            <mossa-skeleton height="20rem" animation="wave" aria-hidden="true"></mossa-skeleton>
        </mossa-responsive-grid>

        <mossa-surface-card data-sale-card appearance="outlined" density="compact" role="alert" cms-condition="$source.error">
            <strong slot="title" data-sale-copy="error-title">Sale not found</strong>
            <span slot="description" data-sale-copy="error-message">This sale could not be loaded.</span>
            <slot name="error-action" slot="actions"></slot>
        </mossa-surface-card>

        <mossa-stack gap="lg" cms-condition="$source.loaded">
            <div
                data-sale-summary
                data-order-id="{{ id }}"
                data-order-number="{{ orderNumber }}"
                data-public-id="{{ publicId }}"
                data-created-at="{{ createdAt }}"
                data-status="{{ status }}"
                data-fulfillment-status="{{ fulfillment.status }}"
                data-currency="{{ currency }}"
                data-financial-currency="{{ financialTerms.currency }}"
                data-subtotal-amount="{{ subtotalAmount }}"
                data-shipping-amount="{{ shippingAmount }}"
                data-merchandise-subtotal-amount="{{ financialTerms.merchandiseSubtotalAmount }}"
                data-seller-commission-amount="{{ financialTerms.sellerCommissionAmount }}"
                data-seller-proceeds-amount="{{ financialTerms.sellerProceedsAmount }}"
                data-seller-shipping-share-amount="{{ financialTerms.sellerShippingShareAmount }}"
                data-platform-shipping-share-amount="{{ financialTerms.platformShippingShareAmount }}"
                data-financial-shipping-amount="{{ financialTerms.shippingAmount }}"
                hidden
            ></div>

            <mossa-section-header>
                <span slot="eyebrow" data-sale-copy="eyebrow">SALE</span>
                <h2 slot="title" data-order-number></h2>
                <span slot="subtitle" data-order-date></span>
                <mossa-badge slot="action" data-order-status variant="filled"></mossa-badge>
            </mossa-section-header>

            <mossa-responsive-grid min="md" gap="lg">
                <mossa-stack gap="md">
                    <mossa-surface-card data-sale-card appearance="outlined" density="compact">
                        <strong slot="title" data-sale-copy="articles-title">Sold items</strong>
                        <mossa-stack gap="sm">
                            <mossa-responsive-grid
                                data-sale-line
                                data-title="{{ line.title }}"
                                data-snapshot-title="{{ line.offerSnapshot.title }}"
                                data-variant-title="{{ line.variantSnapshot.title }}"
                                data-quantity="{{ line.quantity }}"
                                data-condition-label="{{ line.offerSnapshot.conditionLabel }}"
                                data-condition-code="{{ line.offerSnapshot.conditionCode }}"
                                data-total-amount="{{ line.totalAmount }}"
                                min="sm"
                                max="none"
                                gap="md"
                                cms-repeat="lines as line"
                            >
                                <i
                                    data-variant-option
                                    data-axis-key="{{ option.axisKey }}"
                                    data-axis-label="{{ option.axisLabel }}"
                                    data-value-key="{{ option.valueKey }}"
                                    data-value-label="{{ option.valueLabel }}"
                                    hidden
                                    cms-repeat="line.variantSnapshot.options as option"
                                ></i>
                                <mossa-stack gap="xs">
                                    <strong data-line-title></strong>
                                    <small data-line-meta></small>
                                </mossa-stack>
                                <strong data-line-price></strong>
                            </mossa-responsive-grid>
                        </mossa-stack>
                    </mossa-surface-card>
                    <div data-fulfillment><slot name="fulfillment"></slot></div>
                </mossa-stack>

                <mossa-surface-card data-sale-card appearance="outlined" density="compact">
                    <strong slot="title" data-sale-copy="summary-title">Summary</strong>
                    <mossa-stack gap="sm">
                        <mossa-info-row label="Sale price">
                            <span slot="label" data-sale-copy="subtotal-label">Sale price</span>
                            <strong data-subtotal></strong>
                        </mossa-info-row>
                        <mossa-info-row label="Platform commission">
                            <span slot="label" data-sale-copy="commission-label">Platform commission</span>
                            <strong data-commission></strong>
                        </mossa-info-row>
                        <mossa-info-row label="Delivery">
                            <span slot="label" data-sale-copy="shipping-label">Delivery</span>
                            <strong data-shipping></strong>
                        </mossa-info-row>
                        <mossa-info-row label="Net amount to receive" emphasis="strong">
                            <span slot="label" data-sale-copy="total-label">Net amount to receive</span>
                            <strong data-total></strong>
                        </mossa-info-row>
                    </mossa-stack>
                </mossa-surface-card>
            </mossa-responsive-grid>
        </mossa-stack>
    </section>
</mossa-commerce-sale-detail-controller>
