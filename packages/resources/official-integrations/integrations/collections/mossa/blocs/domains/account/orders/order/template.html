<mossa-order-controller data-p9r-composition-controller>
    <div data-loading>
        <mossa-stack gap="md">
            <mossa-skeleton height="7rem" animation="wave" label="Loading order"></mossa-skeleton>
            <mossa-skeleton height="18rem" animation="wave" aria-hidden="true"></mossa-skeleton>
            <mossa-responsive-grid min="md" gap="md">
                <mossa-skeleton height="15rem" animation="wave" aria-hidden="true"></mossa-skeleton>
                <mossa-skeleton height="15rem" animation="wave" aria-hidden="true"></mossa-skeleton>
            </mossa-responsive-grid>
        </mossa-stack>
    </div>

    <mossa-surface-card data-error hidden appearance="outlined" density="spacious">
        <strong slot="title">Order not found</strong>
        <span slot="description" data-error-message></span>
        <slot name="error-action" slot="actions"></slot>
    </mossa-surface-card>

    <mossa-stack data-content hidden gap="xl">
        <mossa-section-header>
            <div slot="title">
                <span class="eyebrow" data-order-copy="order-eyebrow">ORDER</span>
                <h1 data-order-number></h1>
                <p data-order-date></p>
            </div>
            <mossa-badge slot="action" data-order-status></mossa-badge>
        </mossa-section-header>

        <mossa-responsive-grid min="lg" packing="fit" gap="lg">
            <mossa-stack gap="md">
                <mossa-surface-card class="tracking-card" appearance="outlined" density="regular">
                    <strong slot="title" data-delivery-title>Delivery tracking</strong>
                    <span slot="description" data-delivery-description></span>

                    <mossa-responsive-grid data-progress min="xs" packing="fit" gap="xs" aria-label="Delivery progress">
                        <mossa-badge data-progress-step><span data-order-copy="progress-confirmed-label">Confirmed</span></mossa-badge>
                        <mossa-badge data-progress-step><span data-order-copy="progress-prepared-label">Prepared</span></mossa-badge>
                        <mossa-badge data-progress-step><span data-order-copy="progress-shipped-label">Shipped</span></mossa-badge>
                        <mossa-badge data-progress-step><span data-order-copy="progress-pickup-label">At pickup point</span></mossa-badge>
                    </mossa-responsive-grid>

                    <mossa-stack gap="sm">
                        <mossa-info-row>
                            <span slot="icon" aria-hidden="true">◷</span>
                            <span slot="label">Estimate</span>
                            <span data-delivery-estimate></span>
                        </mossa-info-row>
                        <mossa-info-row data-latest-event hidden>
                            <span slot="icon" aria-hidden="true">•</span>
                            <strong data-latest-event-label></strong>
                            <span data-latest-event-date></span>
                        </mossa-info-row>
                        <span class="tracking-number" data-tracking-number hidden></span>
                    </mossa-stack>

                    <slot name="tracking-action" slot="actions"></slot>
                </mossa-surface-card>

                <mossa-surface-card appearance="outlined" density="compact">
                    <strong slot="title" data-order-copy="item-heading">Ordered item</strong>
                    <mossa-commerce-offer-preview appearance="plain">
                        <img
                            slot="media"
                            data-image
                            data-source-image-access="public"
                            loading="lazy"
                            decoding="async"
                            alt=""
                            hidden
                        >
                        <strong slot="title" data-line-title></strong>
                        <mossa-stack gap="xs">
                            <span data-line-variant></span>
                            <span data-line-condition></span>
                        </mossa-stack>
                        <strong slot="price" data-line-price></strong>
                    </mossa-commerce-offer-preview>
                </mossa-surface-card>
            </mossa-stack>

            <mossa-stack gap="md">
                <mossa-surface-card appearance="outlined" density="compact">
                    <strong slot="title" data-order-copy="summary-heading">Summary</strong>
                    <mossa-stack gap="sm">
                        <mossa-info-row><span slot="icon" aria-hidden="true">·</span><span slot="label" data-order-copy="item-label">Item</span><strong data-subtotal></strong></mossa-info-row>
                        <mossa-info-row><span slot="icon" aria-hidden="true">·</span><span slot="label" data-order-copy="delivery-label">Delivery</span><strong data-shipping></strong></mossa-info-row>
                        <mossa-info-row><span slot="icon" aria-hidden="true">·</span><span slot="label" data-order-copy="protection-label">Buyer protection</span><strong data-protection></strong></mossa-info-row>
                        <mossa-info-row><span slot="icon" aria-hidden="true">=</span><span slot="label" data-order-copy="total-label">Total</span><strong data-total></strong></mossa-info-row>
                        <mossa-badge data-payment-confirmation></mossa-badge>
                    </mossa-stack>
                    <slot name="resume-action"></slot>
                </mossa-surface-card>

                <mossa-surface-card appearance="outlined" density="compact">
                    <strong slot="title" data-order-copy="relay-heading">Selected pickup point</strong>
                    <mossa-stack gap="xs">
                        <mossa-badge tone="secondary">Mondial Relay</mossa-badge>
                        <strong data-relay-name></strong>
                        <span data-relay-address></span>
                        <mossa-badge data-relay-confirmation></mossa-badge>
                    </mossa-stack>
                </mossa-surface-card>
            </mossa-stack>
        </mossa-responsive-grid>
    </mossa-stack>

    <form data-order-source cms-source="/.cms/sources/commerce/myOrder" cms-source-trigger="submit" cms-source-method="GET" hidden><input data-order-id name="id" type="hidden"></form>
    <form data-payment-source cms-source="/.cms/sources/system-functions/getPaymentForOrder" cms-source-trigger="submit" cms-source-method="GET" hidden><input data-payment-id name="orderId" type="hidden"></form>
    <form data-relay-source cms-source="/.cms/sources/system-functions/getRelayPointForOrder" cms-source-trigger="submit" cms-source-method="GET" hidden><input data-relay-id name="orderId" type="hidden"></form>
    <form data-shipment-source cms-source="/.cms/sources/system-functions/getShipmentForOrder" cms-source-trigger="submit" cms-source-method="GET" hidden><input data-shipment-id name="orderId" type="hidden"></form>
    <form data-offer-source cms-source="/.cms/sources/commerce/offer" cms-source-trigger="submit" cms-source-method="GET" hidden><input data-offer-id name="id" type="hidden"></form>
</mossa-order-controller>
